services:

  server:
    image: ghcr.io/irfanalam13/findit-server:${IMAGE_TAG:-latest}

    container_name: findit-server

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  client:
    image: ghcr.io/irfanalam13/findit-client:${IMAGE_TAG:-latest}

    container_name: findit-client

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      server:
        condition: service_healthy