
name: Findit CI/CD Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: findit-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CLIENT_IMAGE: ghcr.io/irfanalam13/findit-client
  SERVER_IMAGE: ghcr.io/irfanalam13/findit-server

jobs:

  # ==========================================
  # JOB 1: FRONTEND CI
  # ==========================================

  frontend-ci:
    name: Frontend - Lint & Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: /api
        run: npm run build


  # ==========================================
  # JOB 2: BACKEND CI
  # ==========================================

  backend-ci:
    name: Backend - Automated Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run backend tests
        working-directory: server
        run: npm test


  # ==========================================
  # JOB 3: BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  docker:
    name: Build & Push Docker Images

    needs:
      - frontend-ci
      - backend-ci

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build frontend image

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true

          build-args: |
            VITE_API_URL=/api

          tags: |
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
            ${{ env.CLIENT_IMAGE }}:latest

          cache-from: type=gha,scope=findit-client
          cache-to: type=gha,mode=max,scope=findit-client

      # Build backend image

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true

          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest

          cache-from: type=gha,scope=findit-server
          cache-to: type=gha,mode=max,scope=findit-server


  # ==========================================
  # JOB 4: DEPLOY TO AWS EC2
  # ==========================================

  deploy:
    name: Deploy to AWS EC2

    needs: docker

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2

        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}

          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -euo pipefail

            APP_DIR="/opt/findit"

            echo "Starting Findit deployment..."

            # Clone repository on first deployment
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$USER":"$USER" "$APP_DIR"

              git clone \
                https://github.com/${{ github.repository }}.git \
                "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Get latest deployment configuration
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # Verify production environment file
            test -f .env.production

            # Login to private GHCR packages
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            # Use this exact commit's Docker images
            export IMAGE_TAG

            # Pull new images
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml pull

            # Deploy
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml up -d --remove-orphans

            # Check API health
            HEALTHY=false

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/api/health; then
                HEALTHY=true
                break
              fi

              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml logs --tail=100

              exit 1
            fi

            # Run existing API smoke tests
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              exec -T server \
              env API_BASE_URL=http://127.0.0.1:5000/api \
              node scripts/smoke-test.js

            echo "Findit deployment completed successfully!"
