<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
  <title id="title">findit logo</title>
  <desc id="desc">Findit lost and found logo with a location pin, magnifying glass, and check mark.</desc>
  <defs>
    <linearGradient id="pinGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(12 8)">
    <path d="M48 4C23.7 4 4 23.7 4 48c0 32.4 44 69 44 69s44-36.6 44-69C92 23.7 72.3 4 48 4Z"
          fill="url(#pinGradient)"/>
    <circle cx="48" cy="46" r="27" fill="#FFFFFF"/>
    <circle cx="48" cy="46" r="21" fill="#EFF6FF"/>
    <!-- magnifier -->
    <circle cx="46" cy="44" r="13" fill="none" stroke="#1D4ED8" stroke-width="5"/>
    <path d="M56 54 68 66" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round"/>
    <!-- found-item check -->
    <path d="m39 44 5 5 10-11" fill="none" stroke="#F97316" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="125" y="76" font-family="Inter, Poppins, Arial, sans-serif"
        font-size="60" font-weight="750" letter-spacing="-2">
    <tspan fill="#102A56">find</tspan><tspan fill="#F97316">it</tspan>
  </text>
</svg>
